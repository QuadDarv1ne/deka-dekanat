name: deka

x-application: &application
  image: deka:${DEKA_VERSION:-local}
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile
    args:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5180}
  environment: &application-environment
    DATABASE_URL: postgres://deka_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in your Compose environment}@database:5432/deka
    HOST: 0.0.0.0
    PORT: '3000'
    BODY_SIZE_LIMIT: '1200000'
    DEMO_MODE: ${DEMO_MODE:-false}
    AI_BASE_URL: http://ai:8080/v1
    AI_MODEL: deka-assistant
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  model-init:
    image: node:26.13.0-bookworm-slim
    profiles: [ai]
    command: [node, /setup/download-model.mjs]
    environment:
      MODEL_DIRECTORY: /models
    volumes:
      - ../assistant:/setup:ro
      - ../../var/models:/models
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'

  database:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: deka_owner
      POSTGRES_DB: deka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your Compose environment}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in your Compose environment}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-application-user.sh:/docker-entrypoint-initdb.d/10-application-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U deka_owner -d deka']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *application
    command: [node, tooling/database/migrate.mjs]
    environment:
      <<: *application-environment
      DATABASE_URL: postgres://deka_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/deka
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      disable: true

  app:
    <<: *application
    ports:
      - '127.0.0.1:${APP_PORT:-5180}:3000'
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  seed:
    <<: *application
    profiles: [sample-data]
    command: [node, tooling/database/seed.mjs]
    environment:
      <<: *application-environment
      DATABASE_URL: postgres://deka_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/deka
      DEMO_MODE: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    healthcheck:
      disable: true

  ai:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23}
    profiles: [ai]
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      LLAMA_ARG_N_GPU_LAYERS: '0'
    command:
      [
        '--model',
        '/models/MiniCPM5-2B-Q4_K_M.gguf',
        '--host',
        '0.0.0.0',
        '--port',
        '8080',
        '--ctx-size',
        '16384',
        '--parallel',
        '2',
        '--jinja',
        '--alias',
        'deka-assistant',
        '--threads',
        '6'
      ]
    volumes:
      - ../../var/models:/models:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 12

volumes:
  postgres-data:
